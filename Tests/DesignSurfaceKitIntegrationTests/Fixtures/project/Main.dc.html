<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Checkout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#ffffff} .row{height:20px}</style>
</helmet>
<div id="root" class="board {{variant}}" style="width: 400px; height: 300px; box-sizing: border-box; background: rgb(10, 20, 30); color: {{ink}}; display: flex; flex-direction: column; gap: 4px">
<h1 id="title" style="margin: 0; font-size: 20px">{{title}}</h1>
<sc-for list="{{items}}" as="item" hint-placeholder-count="2">
<div class="row" data-index="{{$index}}">{{item.label}} · {{$index}}</div>
</sc-for>
<sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
<p id="open" style="margin: 0">Open</p>
</sc-if>
<sc-if value="{{closed}}">
<p id="closed">Closed</p>
</sc-if>
<sc-for list="{{cards}}" as="card">
<dc-import name="Card" item="{{card}}" accent-color="{{ink}}" hint-size="100px,20px"></dc-import>
</sc-for>
<button id="count" type="button" onClick="{{bump}}">Clicked {{clicks}}</button>
<input id="field" value="typed">
<a id="next" href="Next.dc.html">Next</a>
<a id="rooted" href="/flows/Cart.dc.html">Cart</a>
<svg width="16" height="16" viewBox="0 0 16 16"><path d="M1 1h14" stroke="#000" stroke-width="2"/></svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":300}}'>
class Component extends DCLogic {
  state = { clicks: 0 };
  renderVals() {
    return {
      title: 'Checkout', variant: 'wide', ink: 'rgb(250, 250, 250)',
      items: [{ label: 'First' }, { label: 'Second' }, { label: 'Third' }],
      open: true, closed: false,
      cards: [{ title: 'A' }, { title: 'B' }],
      clicks: this.state.clicks,
      bump: () => this.setState({ clicks: this.state.clicks + 1 }),
    };
  }
}
</script>
</body>
</html>
