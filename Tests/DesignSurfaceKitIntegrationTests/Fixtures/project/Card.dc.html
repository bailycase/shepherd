<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0} .card{font-weight:600}</style>
</helmet>
<div class="card" style="width: 100px; height: 20px; color: {{accent}}"><span>{{title}}</span></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"item":{"editor":null},"accentColor":{"editor":null},"$preview":{"width":100,"height":20}}'>
class Component extends DCLogic {
  renderVals() {
    return { title: this.props.item ? this.props.item.title : '', accent: this.props.accentColor };
  }
}
</script>
</body>
</html>
