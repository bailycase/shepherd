name: Release

# One workflow ships two apps. scripts/release.py holds the rules (tested in
# Tests/Release); this file only runs them.
#
#   tag vX.Y.Z          → Shepherd, stable   (appcast.xml)
#   tag vX.Y.Z-beta.N   → Shepherd, beta     (appcast-beta.xml — beta + stable items)
#   push to nightly     → Shepherd Nightly   (appcast-shepherd-nightly.xml)
#   tag vX.Y.Z-rc.N     → nothing: release candidates are retired
#   manual run          → as above for its ref; any branch but nightly builds nothing
#   manual run on nightly with testflight=true
#                       → Shepherd iOS to TestFlight internal testing, and no Mac build
#                         (gh workflow run release.yml --ref nightly -f testflight=true)
#
# No push uploads the iOS client (Shepherd iOS): Apple caps TestFlight uploads per
# day (ITMS-90382), so only a manual TestFlight run does, in its own job on an
# Xcode 27 runner. It is skipped with a notice when the App Store Connect key
# below is not configured, and refused on a re-run (the build number would
# repeat). Beta and stable tags upload nothing yet. After a successful upload,
# retire-testflight expires every older TestFlight build, so only the newest
# stays installable.
#
# Shepherd Nightly is its own app (com.bailycase.shepherd.nightly, Shepherd
# Nightly.app, Shepherd-Nightly.dmg), so it installs beside Shepherd and only
# ever reads its own feed. Builds already in the field still read
# appcast-rc.xml and appcast-nightly.xml: both are the beta feed with its items
# untagged, which every such build sees, so they update to a Shepherd build
# that moves them to Beta, and never to Shepherd Nightly.
#
# Each selected build is signed, notarized and packaged into a DMG, published as a
# GitHub Release, and every appcast on gh-pages is regenerated. Signing is
# Developer ID + notarization when the secrets exist, ad-hoc otherwise.
#
# Secrets (all optional until Developer ID exists):
#   SPARKLE_PRIVATE_KEY   EdDSA private key from `generate_keys -x` (one key for both apps)
#   DEVELOPER_ID_P12      base64 .p12 of the Developer ID Application cert
#   DEVELOPER_ID_P12_PASSWORD
#   NOTARY_KEY_ID / NOTARY_ISSUER_ID / NOTARY_KEY  App Store Connect API key
#   APP_STORE_CONNECT_KEY_ID / APP_STORE_CONNECT_ISSUER_ID / APP_STORE_CONNECT_KEY_P8
#                         Team API key with the Admin role, for the TestFlight upload;
#                         _P8 is the AuthKey_<id>.p8 file's text pasted as-is (not base64)
#
# No swift test step: CI already ran `swift test` on the commit being tagged.
on:
  push:
    tags: ["v*"]
    branches: [nightly]
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload the iOS client to TestFlight instead of building Shepherd Nightly
        type: boolean
        default: false

permissions:
  contents: write

# Runs queue and never cancel: a push waits for the running release to finish, and a newer push
# replaces only the one still waiting, so every started run completes and the newest commit ships next.
# A TestFlight run queues apart: sharing the pushes' group, it would replace a waiting push (whose
# commit then never reaches Shepherd Nightly) or be replaced by one (and never upload).
concurrency:
  group: release-${{ github.ref }}${{ inputs.testflight && '-testflight' || '' }}
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
      - name: Test the release rules
        run: python3 -m unittest discover -s Tests/Release -v
      # Secrets cannot appear in `if:`, so only whether all three are set
      # leaves this step; their values never reach the plan.
      - name: App Store Connect key
        id: asc
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          if [[ -n "$KEY_ID" && -n "$ISSUER_ID" && -n "$KEY_P8" ]]; then
            echo "flag=--asc-key" >> "$GITHUB_OUTPUT"
          fi
      - name: Plan
        id: plan
        run: |
          # A re-run keeps the run number (the build number), so release.py
          # refuses a nightly re-run whose commit already has a nightly tag.
          published=""
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            published=$(git ls-remote --tags origin 'refs/tags/nightly-*' \
              | awk -v sha="$GITHUB_SHA" '$1 == sha { sub("refs/tags/", "", $2); print $2; exit }')
          fi
          # Only a manual run asks for TestFlight; every push plans without it.
          plan=$(python3 scripts/release.py plan "$GITHUB_REF" "$(date -u +%Y%m%d%H%M)" \
            "$GITHUB_RUN_ATTEMPT" "$published" ${{ steps.asc.outputs.flag }} \
            ${{ github.event_name == 'workflow_dispatch' && inputs.testflight && '--testflight' || '' }})
          echo "$plan" >> "$GITHUB_OUTPUT"
          jq -r 'if .build then "\(.title): \(.scheme), \(.configuration), \(.dmg)" else "::notice::\(.reason)" end' <<<"${plan#plan=}"
          jq -r 'if .ios then "TestFlight: \(.ios_scheme), \(.ios_configuration), \(.ios_testing) testing" else "::notice title=TestFlight::\(.ios_reason)" end' <<<"${plan#plan=}"

  horizon:
    name: Prefer Horizon for Nightly
    needs: plan
    if: fromJSON(needs.plan.outputs.plan).build && fromJSON(needs.plan.outputs.plan).channel == 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      actions: write
    outputs:
      fallback: ${{ steps.select.outputs.fallback }}
      package_run: ${{ steps.select.outputs.package_run }}
    env:
      GH_TOKEN: ${{ github.token }}
      PARENT_RUN: ${{ github.run_id }}
      PARENT_ATTEMPT: ${{ github.run_attempt }}
      SOURCE_SHA: ${{ github.sha }}
      BUILD_NUMBER: ${{ github.run_number }}
      RELEASE_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select the local package or safe hosted fallback
        id: select
        run: python3 scripts/release_runner.py select
      - name: Cancel a remaining local attempt
        if: always()
        env:
          WORKER_RUN: ${{ steps.select.outputs.worker_run }}
        run: python3 scripts/release_runner.py cancel

  hosted-build:
    name: Hosted build
    needs: [plan, horizon]
    if: >-
      !cancelled() && fromJSON(needs.plan.outputs.plan).build &&
      (fromJSON(needs.plan.outputs.plan).channel != 'nightly' ||
      (needs.horizon.result == 'success' && needs.horizon.outputs.fallback == 'true'))
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/release-build.yml
    with:
      hosted: true
      parent_run: ${{ format('{0}', github.run_id) }}
      parent_attempt: ${{ format('{0}', github.run_attempt) }}
      source_sha: ${{ github.sha }}
      build_number: ${{ format('{0}', github.run_number) }}
      plan: ${{ needs.plan.outputs.plan }}
    secrets:
      DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      NOTARY_KEY: ${{ secrets.NOTARY_KEY }}

  release:
    name: publish selected package
    needs: [plan, horizon, hosted-build]
    if: >-
      !cancelled() && fromJSON(needs.plan.outputs.plan).build &&
      (needs.hosted-build.result == 'success' ||
      (needs.horizon.result == 'success' && needs.horizon.outputs.package_run != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      CHANNEL: ${{ fromJSON(needs.plan.outputs.plan).channel }}
      TAG: ${{ fromJSON(needs.plan.outputs.plan).tag }}
      DMG: ${{ fromJSON(needs.plan.outputs.plan).dmg }}
      DSYMS: ${{ fromJSON(needs.plan.outputs.plan).dsyms }}
      TITLE: ${{ fromJSON(needs.plan.outputs.plan).title }}
      PRERELEASE: ${{ fromJSON(needs.plan.outputs.plan).prerelease }}
      NOTES: ${{ fromJSON(needs.plan.outputs.plan).notes }}
      PARENT_RUN: ${{ github.run_id }}
      PARENT_ATTEMPT: ${{ github.run_attempt }}
      SOURCE_SHA: ${{ github.sha }}
      BUILD_NUMBER: ${{ github.run_number }}
      RELEASE_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the selected package
        uses: actions/download-artifact@v4
        with:
          name: release-package-${{ github.run_id }}-${{ github.run_attempt }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.horizon.outputs.package_run || github.run_id }}
      - name: Verify package provenance
        run: python3 scripts/release_runner.py verify
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f "$DMG"
          test -f shepherd-appcast.json
          ARGS=(--title "$TITLE" --notes "$NOTES" --draft)
          # beta and nightly are GitHub prereleases; feed membership is by tag
          # NAME (release.py route), never by the prerelease flag — so the
          # nightly cleanup matches names too, or it would eat betas.
          if [[ "$PRERELEASE" == "true" ]]; then
            ARGS+=(--prerelease)
          fi
          if [[ "$CHANNEL" == "nightly" ]]; then
            git tag "$TAG" && git push origin "$TAG"
          fi
          gh release create "$TAG" "$DMG" shepherd-appcast.json "${ARGS[@]}"
          if [[ -f "$DSYMS" ]]; then
            gh release upload "$TAG" "$DSYMS" \
              || echo "::warning::Could not attach dSYMs to $TAG."
          fi
          # Publish last: nobody may consume a partly uploaded release.
          gh release edit "$TAG" --draft=false

  publish-appcasts:
    name: publish appcasts
    needs: [plan, release]
    if: needs.release.result == 'success'
    runs-on: macos-26
    timeout-minutes: 45
    # Only publication coalesces: every tagged build keeps its own release. A replacement
    # waiting publisher rebuilds from all completed releases once it acquires this slot.
    concurrency:
      group: appcast-publication
      cancel-in-progress: false
    env:
      TAG: ${{ fromJSON(needs.plan.outputs.plan).tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Update appcasts
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "No SPARKLE_PRIVATE_KEY secret; skipping appcast." && exit 0
          fi
          # This job has no build products. Resolve pinned tools, never a floating download.
          swift package resolve --force-resolved-versions
          BIN=$(find .build -path '*artifacts*Sparkle/bin' -type d | head -1)
          test -x "$BIN/generate_appcast"
          echo "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_key"

          # The appcasts are rebuilt from every published release so they
          # always reflect the full history. release.py route says which feed
          # directories each release lands in and which asset feeds them: a
          # stable DMG also lands in beta (the superset), and a nightly-*
          # release feeds Shepherd Nightly only through Shepherd-Nightly.dmg.
          gh release list --limit 100 --exclude-drafts --json tagName --jq '.[].tagName' > "$RUNNER_TEMP/tags"
          # Keep four completed nightlies. Freeze this selection under the publication lock;
          # prune only these superseded releases, and only after the feeds no longer name them.
          awk '/^nightly-/ { if (++n > 4) print }' "$RUNNER_TEMP/tags" > "$RUNNER_TEMP/prune-tags"
          awk 'FILENAME==ARGV[1] { old[$0]=1; next } !($0 in old)' "$RUNNER_TEMP/prune-tags" "$RUNNER_TEMP/tags" > "$RUNNER_TEMP/feed-tags"
          : > "$RUNNER_TEMP/staged-tags"
          python3 scripts/release.py feeds > "$RUNNER_TEMP/feeds"
          while read -r dir channel; do mkdir -p "casts/$dir"; done < "$RUNNER_TEMP/feeds"
          python3 scripts/release.py route < "$RUNNER_TEMP/feed-tags" > "$RUNNER_TEMP/routes"
          while read -r tag asset archive feeds; do
            # Metadata/download errors fail closed, including malformed eligibility records.
            gh release view "$tag" --json assets,isDraft > "$RUNNER_TEMP/release-assets.json" </dev/null
            policy=-
            marked=$(python3 -c 'import json,sys; print(any(a["name"] == "shepherd-appcast.json" for a in json.load(open(sys.argv[1]))["assets"]))' "$RUNNER_TEMP/release-assets.json")
            if [[ "$marked" == True ]]; then
              policy="$RUNNER_TEMP/appcast-policy.json"
              gh release download "$tag" -p shepherd-appcast.json -O "$policy" --clobber </dev/null
            fi
            disposition=$(python3 scripts/release.py appcast-asset "$tag" "$asset" "$RUNNER_TEMP/release-assets.json" "$policy")
            if [[ "$disposition" == skip ]]; then continue; fi
            IFS=, read -r -a dirs <<<"$feeds"
            first="casts/${dirs[0]}"
            gh release download "$tag" -p "$asset" -O "$first/$archive" </dev/null
            printf '%s\n' "$tag" >> "$RUNNER_TEMP/staged-tags"
            for dir in "${dirs[@]:1}"; do
              cp "$first/$archive" "casts/$dir/"
            done
          done < "$RUNNER_TEMP/routes"

          # generate_appcast errors on an empty directory (e.g. no stable
          # releases yet); an empty channel keeps an empty feed instead.
          empty_feed() {
            printf '<?xml version="1.0" encoding="utf-8"?>\n<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle"><channel><title>Shepherd</title></channel></rss>\n' > "$1"
          }
          # One generate_appcast run per feed directory. A tagged feed marks
          # every item with its channel (the client allows exactly that one).
          # -o: left alone, generate_appcast names the file after the app's
          # SUFeedURL. compgen, not ls: `ls *.dmg` fails when the glob is
          # unmatched. Then point each archive at its tag's asset, and upload
          # the feed's deltas (small binary patches to the newest build) to its
          # newest release so Sparkle can update with a patch instead of the
          # DMG. release.py deltas renames them first: Shepherd Nightly's are
          # named after the app, with a space GitHub would rewrite. Commands
          # inside the loops read /dev/null, never the list being looped over.
          while read -r dir channel; do
            args=(--ed-key-file "$RUNNER_TEMP/sparkle_key" \
              --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/" \
              --link "https://github.com/${{ github.repository }}" \
              -o "casts/$dir/appcast.xml")
            [[ "$channel" != "-" ]] && args+=(--channel "$channel")
            if compgen -G "casts/$dir/*.dmg" >/dev/null; then
              "$BIN/generate_appcast" "${args[@]}" "casts/$dir" </dev/null
            else
              empty_feed "casts/$dir/appcast.xml"
            fi
            python3 scripts/release.py fix-urls "casts/$dir/appcast.xml" "$dir"
            latest=$(python3 scripts/release.py latest "$dir" < "$RUNNER_TEMP/staged-tags")
            if [[ -n "$latest" ]]; then
              python3 scripts/release.py deltas "casts/$dir" "$latest" > "$RUNNER_TEMP/deltas.txt"
              deltas=()
              while IFS= read -r delta; do deltas+=("$delta"); done < "$RUNNER_TEMP/deltas.txt"
              if [[ ${#deltas[@]} -gt 0 ]]; then
                gh release upload "$latest" "${deltas[@]}" --clobber </dev/null
              fi
            fi
          done < "$RUNNER_TEMP/feeds"

          git config user.name github-actions
          git config user.email github-actions@github.com
          git ls-remote --heads origin gh-pages > "$RUNNER_TEMP/pages-ref"
          if [[ -s "$RUNNER_TEMP/pages-ref" ]]; then git fetch origin gh-pages; fi
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git worktree add pages origin/gh-pages
          else
            git worktree add --orphan -b gh-pages pages
          fi
          # Every feed, plus appcast-rc.xml and appcast-nightly.xml for the
          # Shepherd builds already installed that still read them. publish
          # marks every item arm64 only, so no Intel Mac is offered an update.
          python3 scripts/release.py publish casts pages > "$RUNNER_TEMP/published-feeds.txt"
          written=()
          while IFS= read -r file; do written+=("$file"); done < "$RUNNER_TEMP/published-feeds.txt"
          cd pages
          git add "${written[@]}"
          if ! git diff --cached --quiet; then
            git commit -m "appcast: $TAG"
            git push origin HEAD:gh-pages
          fi
          # Never delete drafts, newly completed releases outside this snapshot, or an
          # archive while another publisher is using it. A failed push reaches none of this.
          while IFS= read -r old; do
            gh release delete "$old" --cleanup-tag --yes </dev/null
          done < "$RUNNER_TEMP/prune-tags"

  # The iOS client, archived unsigned and signed only at export with the team's
  # cloud-managed Apple Distribution certificate: no .p12, no keychain. Signing
  # the archive instead would mint an Apple Development certificate on every
  # clean runner until the account refuses. Nothing here touches the Mac job.
  testflight:
    name: iOS to TestFlight (internal)
    needs: plan
    if: github.event_name != 'pull_request' && fromJSON(needs.plan.outputs.plan).ios
    # The target needs the iOS 27 SDK; macos-26 tops out at Xcode 26.6. The
    # xcode-27 label is in preview, so this job may queue.
    runs-on: xcode-27
    timeout-minutes: 60
    # Read-only: the archive runs package plugins and macros, and nothing here writes the repo.
    permissions:
      contents: read
    env:
      # Never a beta Xcode: App Store Connect refuses its builds (ITMS-90534).
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      SCHEME: ${{ fromJSON(needs.plan.outputs.plan).ios_scheme }}
      CONFIGURATION: ${{ fromJSON(needs.plan.outputs.plan).ios_configuration }}
      PRODUCT: ${{ fromJSON(needs.plan.outputs.plan).ios_product }}
      EXPORT_OPTIONS: ${{ fromJSON(needs.plan.outputs.plan).ios_export_options }}
      # The run number: each TestFlight run has its own, and a re-run (which
      # keeps it) is refused by the plan. The marketing version stays the
      # project's: the Mac nightly's 0.0.0-nightly.<stamp> is not a valid iOS version.
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Xcode
        run: |
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iOS SDK $sdk"
          if (( ${sdk%%.*} < 27 )); then
            echo "::error::Shepherd iOS needs the iOS 27 SDK; $DEVELOPER_DIR has $sdk." && exit 1
          fi
          if [[ "$(realpath "$DEVELOPER_DIR")" == *[Bb]eta* ]]; then
            echo "::error::$DEVELOPER_DIR is a beta Xcode, which App Store Connect refuses." && exit 1
          fi

      # SwiftTerm, the iOS terminal's view, compiles Metal shaders, and the runner's Xcode ships
      # without the Metal toolchain ("cannot execute tool 'metal'").
      - name: Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Archive ${{ env.SCHEME }} (unsigned)
        run: |
          xcodebuild archive \
            -project Shepherd.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Shepherd-iOS.xcarchive" \
            -derivedDataPath build-ios \
            -skipPackagePluginValidation -skipMacroValidation \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$BUILD"

      - name: Verify the archived app
        run: |
          python3 scripts/release.py verify-ios \
            "$RUNNER_TEMP/Shepherd-iOS.xcarchive/Products/Applications/$PRODUCT" "$BUILD"

      - name: Write the App Store Connect key
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          if ! grep -q 'BEGIN PRIVATE KEY' "$RUNNER_TEMP/asc/AuthKey.p8"; then
            echo "::error::APP_STORE_CONNECT_KEY_P8 must be the .p8 file's text as-is, not base64." && exit 1
          fi

      # -allowProvisioningUpdates with the key registers the profile and uses
      # the cloud-managed distribution certificate; destination=upload in the
      # export options sends the signed build to App Store Connect. The build
      # reaches testers once Apple has processed it.
      - name: Sign and upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Shepherd-iOS.xcarchive" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          plutil -p "$RUNNER_TEMP/export/DistributionSummary.plist" 2>/dev/null || true
          echo "::notice title=TestFlight::Uploaded $SCHEME build $BUILD for internal testing."

      - name: Remove the App Store Connect key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

  # Keeps only the newest Shepherd iOS build installable in TestFlight. It waits
  # for Apple to process the build the testflight job just uploaded (up to 45
  # minutes; then it gives up and expires nothing) and expires every older one.
  # release.py retire-testflight holds the rules (tested in Tests/Release).
  retire-testflight:
    name: Retire older TestFlight builds
    needs: [plan, testflight]
    if: >-
      github.event_name != 'pull_request' && fromJSON(needs.plan.outputs.plan).ios &&
      needs.testflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    # Two runs never race over the same builds: a later one waits its turn.
    concurrency:
      group: testflight-retire
      cancel-in-progress: false
    env:
      # The build number the testflight job uploaded.
      BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Secrets cannot appear in `if:`, so only whether all three are set
      # leaves this step.
      - name: Write the App Store Connect key
        id: key
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          if [[ -z "$KEY_ID" || -z "$ISSUER_ID" || -z "$KEY_P8" ]]; then
            echo "::notice title=TestFlight::The APP_STORE_CONNECT_* secrets are not all set; nothing to retire."
            exit 0
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          if ! grep -q 'BEGIN PRIVATE KEY' "$RUNNER_TEMP/asc/AuthKey.p8"; then
            echo "::error::APP_STORE_CONNECT_KEY_P8 must be the .p8 file's text as-is, not base64." && exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Expire older builds
        if: steps.key.outputs.ready == 'true'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          python3 scripts/release.py retire-testflight --key-file "$RUNNER_TEMP/asc/AuthKey.p8" \
            --timeout 2700 --interval 45 --wait-for-build "$BUILD"

      - name: Remove the App Store Connect key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
