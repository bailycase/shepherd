name: CI

# One Swift job, hosted by default. Self-hosted is opt-in only on a resource-isolated Mac:
# a separate account cannot protect other apps from build memory pressure. When enabled,
# maintainer PRs and explicit UI diagnostics can reuse its persistent build. Diagnostics
# report `UI diagnostics`, never `CI`. Other checks run on Ubuntu.
#
# There are no path filters here: a filtered-out workflow never reports the `CI` check, so the
# plan step decides instead, and `CI` always reports. A change to docs alone runs no Swift.
# Tests whose verdict depends on the machine's speed skip here, where CI=true (`.timingSensitive`).
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]
  schedule:
    # Only the default branch's copy of this file is scheduled, so this starts once master has it.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      clean:
        description: Ignore the persistent build and build from scratch
        type: boolean
        default: false
      diagnostics:
        description: Run focused UI diagnostics, never the required CI check
        type: choice
        options: [none, ui]
        default: none

permissions:
  contents: read

# A newer push supersedes a running build of the same branch or pull request.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'daily' || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Ordinary nightly PRs retain unit + smoke + affected suites; shared/unknown paths run all.
  plan:
    name: plan
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      swift: ${{ steps.plan.outputs.swift }}
      filters: ${{ steps.plan.outputs.filters }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'schedule' && 'master' || '' }}
      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          DIAGNOSTICS: ${{ github.event.inputs.diagnostics }}
          FULL: ${{ github.event_name != 'pull_request' || github.event.pull_request.base.ref != 'nightly' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            # The merge checkout's first parent is the base.
            git diff --name-only --no-renames HEAD^1 HEAD > changed.txt
          else
            printf 'Package.swift\n' > changed.txt
          fi
          args=()
          if [ "$FULL" = true ]; then args=(--full); fi
          if [ "$EVENT" = workflow_dispatch ] && [ "$DIAGNOSTICS" = ui ]; then args=(--ui-diagnostics); fi
          python3 scripts/ci_plan.py changed.txt "${args[@]}" | tee -a "$GITHUB_OUTPUT"

  # The release workflow's rules (scripts/release.py), the CI helper's own tests, the embedded
  # extension copies and the docs' size and link guards. Stdlib only; it costs no macOS runner.
  release-rules:
    name: release rules
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'master' || '' }}
      - run: python3 -m unittest discover -s Tests/Release

  extensions:
    name: extension tests
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'master' || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cache the pinned pi package
        id: pi
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pi-tests
          key: pi-tests-${{ hashFiles('scripts/pi-engine-pin.json') }}
      - name: Install the pinned modular pi package
        if: steps.pi.outputs.cache-hit != 'true'
        run: |
          package=$(python3 -c 'import json; p=json.load(open("scripts/pi-engine-pin.json"))["pi"]; print(p["name"]+"@"+p["version"])')
          npm install --prefix "$RUNNER_TEMP/pi-tests" --ignore-scripts --no-audit --no-fund "$package"
      - name: Test extensions with isolated fake providers
        env:
          PI_PACKAGE_DIR: ${{ runner.temp }}/pi-tests/node_modules/@earendil-works/pi-coding-agent
        run: node --test --test-reporter=spec Tests/Extensions/*.test.mjs

  tests:
    name: swift tests
    needs: plan
    if: ${{ needs.plan.outputs.swift == 'true' }}
    # Native metadata fence, evaluated before checkout; plan outputs cannot grant local access.
    # Custom label only: the runner has no default self-hosted/OS labels.
    runs-on: >-
      ${{ vars.SHEPHERD_SELFHOSTED_ENABLED == 'true' && github.triggering_actor == github.actor &&
          (github.actor_id == '19316389' || github.actor_id == '3370624') &&
          github.workflow_ref == format('{0}/.github/workflows/ci.yml@{1}', github.repository, github.ref) &&
          ((github.event_name == 'pull_request' &&
            github.ref == format('refs/pull/{0}/merge', github.event.pull_request.number) &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            (github.event.pull_request.user.id == 19316389 || github.event.pull_request.user.id == 3370624)) ||
           (github.event_name == 'workflow_dispatch' &&
            github.ref_type == 'branch' && github.event.inputs.diagnostics == 'ui')) &&
          'shepherd-release' || 'macos-26' }}
    timeout-minutes: 60
    env:
      # Mask the built-in runner machine-name log, before any steps run.
      SELFHOSTED_LOG_MASK: ${{ secrets.SELFHOSTED_HOSTNAME }}
    steps:
      - name: Require a logged-in build account for AppKit tests
        if: runner.environment == 'self-hosted'
        run: |
          if ! launchctl print "gui/$(id -u)" > /dev/null 2>&1; then
            echo '::error::UI tests need the build account logged into macOS. Leave its GUI session running; the runner must not log it in or move focus.'
            exit 1
          fi
          if [ "$(launchctl managername 2>/dev/null)" != Aqua ]; then
            echo '::error::UI tests must run inside the build account GUI session. A system service cannot access its pasteboard; use the per-user runner agent.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'master' || '' }}
          clean: ${{ runner.environment != 'self-hosted' }}
          persist-credentials: false
      - uses: ./.github/actions/swift-build
        with:
          clean: ${{ inputs.clean == true }}
      - name: Stage bundled pi and expose its pinned Node to test fixtures
        run: |
          python3 scripts/pi_engine.py stage
          echo "$PWD/.build/pi-engine/Helpers" >> "$GITHUB_PATH"
      # Swift 6.3's single test process otherwise launches every server/process case together,
      # exhausting local resources and timing out unrelated tests. Keep the established CI order.
      - name: Run tests
        env:
          CI: "true"
          SWIFT_FILTERS: ${{ needs.plan.outputs.filters }}
        run: |
          set -o pipefail
          filters=()
          swift test list --skip-build $SWIFTPM_FLAGS > "$RUNNER_TEMP/swift-tests.txt"
          printf 'Native test IDs listed (before filtering): %s\n' "$(wc -l < "$RUNNER_TEMP/swift-tests.txt")"
          if [ "$SWIFT_FILTERS" != '[]' ]; then
            filter=$(python3 scripts/ci_plan.py --validate "$RUNNER_TEMP/swift-tests.txt" "$SWIFT_FILTERS")
            filters=(--filter "$filter")
          fi
          printf 'Swift test flags: --no-parallel --skip-build %s; selection: %s\n' "$SWIFTPM_FLAGS" "${filter:-all native tests}"
          swift test --no-parallel --skip-build $SWIFTPM_FLAGS "${filters[@]}" 2>&1 | tee "$RUNNER_TEMP/swift-test.log"
      - name: Upload the log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-swift-test-log
          path: ${{ runner.temp }}/swift-test.log
          retention-days: 7

  # The one required check. It passes when every job passed or was skipped on purpose.
  ci:
    name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.diagnostics == 'ui' && 'UI diagnostics' || 'CI' }}
    needs: [plan, release-rules, extensions, tests]
    if: ${{ !cancelled() && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) echo "::error::a job ended $result"; exit 1 ;; esac
          done
