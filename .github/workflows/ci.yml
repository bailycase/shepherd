name: CI

# Tests gate PRs and master in four shards, each on its own runner. A push to
# nightly runs no tests (the Release workflow builds every nightly): it only
# rebuilds the caches clean, so every PR based on nightly starts warm. Tests
# whose verdict depends on the machine's speed (frame sampling, wall-clock
# budgets) skip here, where GitHub sets CI=true; `swift test` runs them locally
# (AGENTS.md, Testing).
on:
  push:
    branches: [master, nightly]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      clean:
        description: Ignore the build cache and build from scratch
        type: boolean
        default: false

permissions:
  contents: read

# A newer push supersedes a queued/running build of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# Shards W, R and A each run the suites their regex names; C runs everything
# else, so a new or renamed suite always runs somewhere. Swift Testing matches
# these unanchored against ids like `Module.Suite/test()`. Rebalance when the
# slowest shard beats the fastest by more than 20 s over two runs (the step
# summary lists each suite's time).
env:
  W_RE: 'ShepherdAppIntegrationTests\.(GitWorktreeTests|WorktreeAgentTests|FinalizeWorktreeTests|RemoteWorktreeTests|WorktreeBaseOfflineTests)\b'
  R_RE: 'ShepherdAppIntegrationTests\.(ComposerMenuTests|ComposerMenuPerformanceTests|ThreadScrollingTests)\b'
  A_RE: 'ShepherdAppIntegrationTests\.(ReviewFlowTests|RemoteHostTests|ListPerformanceTests|AgentStartupTests|WorkspaceNavigationTests|ShellMotionTests|ThreadMotionTests|RightPaneMotionTests|ShellTerminalMotionTests|IdleCostTests)\b'

jobs:
  # The release workflow's rules (scripts/release.py): feeds, bundle ids, and
  # their agreement with the Xcode project and the apps. Stdlib only.
  release-rules:
    name: release rules
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/nightly') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s Tests/Release

  test:
    name: tests ${{ matrix.shard }} (${{ matrix.label }})
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/nightly') }}
    runs-on: macos-26
    # A cold build takes about 8 minutes and a shard about 2; the watchdog
    # below ends a stalled test run after 10.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: W, label: git }
          - { shard: R, label: render }
          - { shard: A, label: app }
          - { shard: C, label: rest }
    steps:
      - uses: actions/checkout@v4

      # On a master push or a manual run, C also saves the caches right after
      # building. Pull requests save nothing: each restores its base's newest
      # entry (nightly's from the warm job) and compiles its own changes on top,
      # which keeps the cache quota free and an upload off C's critical path.
      - uses: ./.github/actions/swift-build
        with:
          clean: ${{ inputs.clean }}
          save: ${{ matrix.shard == 'C' && github.event_name != 'pull_request' }}

      # Diagnostic: git calls cost 0.16-0.2 s each in tests here, against
      # 0.035 s on the same image before. Tests run /usr/bin/git, the xcrun shim.
      - name: Time git (diagnostic)
        if: matrix.shard == 'W'
        continue-on-error: true
        run: |
          xcrun --verbose -f git 2>&1 || true
          direct=$(xcrun -f git)
          echo "20x /usr/bin/git --version:"; time (for i in $(seq 20); do /usr/bin/git --version >/dev/null; done)
          echo "20x $direct --version:"; time (for i in $(seq 20); do "$direct" --version >/dev/null; done)

      - name: Run tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          case "$SHARD" in
            W) select=(--filter "$W_RE") ;;
            R) select=(--filter "$R_RE") ;;
            A) select=(--filter "$A_RE") ;;
            C) select=(--skip "$W_RE" --skip "$R_RE" --skip "$A_RE") ;;
          esac
          log="$RUNNER_TEMP/swift-test.log"
          # Serially within a shard: on this shared 3-core runner, tests run in
          # parallel queued behind one another's main-thread work until their
          # waits ran out. The tests that block the main queue or change
          # process-wide state still run as exit tests in their own process.
          (
            set -o pipefail
            swift test --skip-build $SWIFTPM_FLAGS --no-parallel "${select[@]}" 2>&1 | tee "$log"
          ) &
          TEST_PID=$!
          # Every integration suite has a per-test time limit, so a hang that
          # honors cancellation fails by name. The watchdog is for one that
          # does not (a blocked thread): a shard takes about 2 minutes, so if
          # it is still going after 10, dump the hung test host's stacks, then
          # end the run.
          descendants() { local c; for c in $(pgrep -P "$1"); do echo "$c"; descendants "$c"; done; }
          (
            sleep 600
            if kill -0 "$TEST_PID" 2>/dev/null; then
              echo '::group::watchdog: test run stalled, sampling processes'
              pids=$(descendants "$TEST_PID")
              for pid in $pids; do
                command=$(ps -o command= -p "$pid" || true)
                echo "$pid $command"
                case "$command" in
                  *swiftpm-testing*|*xctest*)
                    sample "$pid" 3 -file "/tmp/sample-$pid.txt" || true
                    cat "/tmp/sample-$pid.txt" || true ;;
                esac
              done
              echo '::endgroup::'
              kill -9 $pids 2>/dev/null || true
            fi
          ) &
          WATCHDOG_PID=$!
          STATUS=0
          wait "$TEST_PID" || STATUS=$?
          kill "$WATCHDOG_PID" 2>/dev/null || true

          # Each suite's time, slowest first, for rebalancing the shards.
          python3 - "$log" "$SHARD" >> "$GITHUB_STEP_SUMMARY" <<'EOF' || true
          import re, sys
          rows = []
          for line in open(sys.argv[1], encoding="utf-8", errors="replace"):
              m = re.match(r'^\S+\s+Suite "(.+)" (passed|failed) after ([0-9.]+) seconds', line)
              if m: rows.append((float(m[3]), m[1], m[2]))
          print(f"### Shard {sys.argv[2]}: {len(rows)} suites\n\n| Suite | Result | Seconds |\n|---|---|--:|")
          for secs, name, result in sorted(rows, reverse=True):
              print(f"| {name} | {result} | {secs:.1f} |")
          EOF

          # A passing run with no tests means a filter matched nothing (swift
          # test exits 0 then). The run's own summary is the last such line; a
          # test's output can quote one earlier.
          count=$(grep -E '^[^[:space:]"]+[[:space:]]+Test run with [0-9]+ tests?' "$log" | tail -1 | sed -E 's/.*Test run with ([0-9]+) test.*/\1/' || true)
          if [ "$STATUS" -eq 0 ] && [ "${count:-0}" -eq 0 ]; then
            echo "::error::shard $SHARD ran no tests: check its regex against the suite names"
            STATUS=1
          fi

          # C runs what the other regexes leave. If --skip stopped matching, C
          # would quietly run their suites a second time and still pass.
          if [ "$SHARD" = C ] && [ "$STATUS" -eq 0 ]; then
            expected=unknown
            if swift test list --skip-build $SWIFTPM_FLAGS > "$RUNNER_TEMP/tests.txt"; then
              python3 - "$RUNNER_TEMP/tests.txt" > "$RUNNER_TEMP/expected.txt" <<'EOF' && expected=$(cat "$RUNNER_TEMP/expected.txt")
          import os, re, sys
          res = [re.compile(os.environ[k]) for k in ("W_RE", "R_RE", "A_RE")]
          ids = [l.strip() for l in open(sys.argv[1]) if "/" in l]
          print(sum(1 for i in ids if not any(r.search(i) for r in res)))
          EOF
            fi
            if [ "${count:-0}" != "$expected" ]; then
              echo "::error::shard C ran ${count:-0} tests, but the regexes leave it $expected"
              STATUS=1
            fi
          fi
          exit "$STATUS"

  # Builds clean on every nightly push and saves the caches to nightly's
  # scope, which every PR based on nightly can read (a PR's own caches are
  # readable only by that PR). Building clean keeps incremental drift to one
  # PR's worth of changes.
  warm:
    name: warm caches
    if: github.ref == 'refs/heads/nightly'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/swift-build
        with:
          clean: "true"
          save: "true"

  # The one check to require: green only when every shard and the release
  # rules passed.
  ci:
    name: CI
    if: ${{ always() && !(github.event_name == 'push' && github.ref == 'refs/heads/nightly') }}
    needs: [release-rules, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.release-rules.result }}" = success && test "${{ needs.test.result }}" = success
