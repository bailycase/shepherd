name: CI

# Two lanes (AGENTS.md, Testing). A pull request into nightly gets the fast lane: the unit
# tier, a smoke set, and the integration suites its changed paths can affect, chosen by
# scripts/ci_impact.py. Everything runs on pushes to nightly and master, on pull requests into
# master or labelled `full-ci`, daily (three passes, to find flaky tests), and on demand. The
# full lane is cut into equal shards from Tests/ci-suite-times.json (scripts/ci_shards.py), and
# a failed test is retried once (scripts/ci_run_tests.py): if it passes the second time it is
# reported as flaky instead of failing the run. A red full lane on nightly or master files one
# tracking issue (scripts/ci_report.py).
#
# There are no path filters here: a filtered-out workflow never reports the `CI` check, so the
# plan job decides instead, and `CI` always reports. Tests whose verdict depends on the
# machine's speed (frame sampling, wall-clock budgets) skip here, where GitHub sets CI=true;
# `swift test` runs them locally.
on:
  push:
    branches: [master, nightly]
  pull_request:
    # `labeled` is how the `full-ci` label takes effect; any other label's event ends at once.
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Only the default branch's copy of this file is scheduled, so this starts once master has it.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      lane:
        description: auto and full run everything; fast needs a base; flake-hunt runs the full lane three times
        type: choice
        options: [auto, fast, full, flake-hunt]
        default: auto
      base:
        description: With lane fast, the branch to diff against to choose the suites (for example nightly)
        type: string
        default: ""
      clean:
        description: Ignore the build cache and build from scratch
        type: boolean
        default: false
      shared_build:
        description: Build once in a job of its own and let the shards restore it (otherwise each shard builds)
        type: boolean
        default: true
      report:
        description: File the tracking issue even though this is not nightly or master (to test the report)
        type: boolean
        default: false

permissions:
  contents: read

# A newer push supersedes a running build of the same branch or pull request. The daily run
# has a group of its own, and a label other than full-ci cancels nothing.
concurrency:
  group: >-
    ci-${{ github.event_name == 'schedule' && 'daily' || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'full-ci' && '-label' || '' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

defaults:
  run:
    shell: bash

jobs:
  # What this run does and why: the lane, the suites, the shards. Its summary says which suites
  # ran and why.
  plan:
    name: plan
    if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'full-ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.plan.outputs.lane }}
      swift: ${{ steps.plan.outputs.swift }}
      scope: ${{ steps.plan.outputs.scope }}
      selection: ${{ steps.plan.outputs.selection }}
      shards: ${{ steps.plan.outputs.shards }}
      repeat: ${{ steps.plan.outputs.repeat }}
      shared_build: ${{ steps.plan.outputs.shared_build }}
      report: ${{ steps.plan.outputs.report }}
      clean: ${{ steps.plan.outputs.clean }}
      checkout_ref: ${{ steps.plan.outputs.checkout_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'schedule' && 'nightly' || '' }}
      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF: ${{ github.ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          LANE: ${{ inputs.lane || 'auto' }}
          DISPATCH_BASE: ${{ inputs.base }}
          CLEAN: ${{ inputs.clean }}
          SHARED_BUILD: ${{ inputs.shared_build }}
          FORCE_REPORT: ${{ inputs.report }}
        run: |
          args=()
          if [ "$EVENT" = pull_request ]; then
            # The checkout is the merge of the pull request into its base: the first parent is the base.
            git diff --name-only --no-renames HEAD^1 HEAD > changed.txt
            args+=(--files-from changed.txt)
          elif [ "$EVENT" = workflow_dispatch ] && [ -n "$DISPATCH_BASE" ]; then
            git diff --name-only --no-renames "origin/$DISPATCH_BASE...HEAD" > changed.txt
            args+=(--files-from changed.txt)
          fi
          [ "$CLEAN" = true ] && args+=(--clean)
          [ "$FORCE_REPORT" = true ] && args+=(--report)
          [ -n "$SHARED_BUILD" ] && args+=(--shared-build "$SHARED_BUILD")
          python3 scripts/ci_impact.py --event "$EVENT" --base "$BASE_REF" --ref "$REF" \
            --labels "$LABELS" --lane "$LANE" "${args[@]}"

  # The release workflow's rules (scripts/release.py), the CI helpers' own tests, the embedded
  # extension copies and the docs' size and link guards. Stdlib only; it costs no macOS runner.
  release-rules:
    name: release rules
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.checkout_ref }}
      - run: python3 -m unittest discover -s Tests/Release

  extensions:
    name: extension tests
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.checkout_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the pinned modular pi package
        run: |
          package=$(python3 -c 'import json; p=json.load(open("scripts/pi-engine-pin.json"))["pi"]; print(p["name"]+"@"+p["version"])')
          npm install --prefix "$RUNNER_TEMP/pi-tests" --ignore-scripts --no-audit --no-fund "$package"
          echo "PI_PACKAGE_DIR=$RUNNER_TEMP/pi-tests/node_modules/@earendil-works/pi-coding-agent" >> "$GITHUB_ENV"
      # A failed test is run once more by name; if it passes it is flaky, not red.
      - name: Test extensions with isolated fake providers
        run: python3 scripts/ci_run_tests.py node --out ci-out
      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-results-node
          path: ci-out/*.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-node
          path: ci-out/*.log
          retention-days: 7
          if-no-files-found: ignore

  # After a push (or the daily and manual runs) the build is made once, here, and saved for the
  # shards and for every pull request into the same branch. A pull request has no such job: its
  # shards each restore the base branch's newest build and compile only what the pull request
  # changed. A build is incremental on top of the last one, except the first of each UTC day,
  # which is clean, so drift stays within a day (a manual `clean` forces one too).
  build:
    name: build
    needs: plan
    if: ${{ needs.plan.outputs.swift == 'true' && needs.plan.outputs.shared_build == 'true' }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.checkout_ref }}
      - name: Today's clean build
        id: day
        run: echo "key=ci-clean-build-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Has today's clean build been made
        id: marker
        uses: actions/cache/restore@v4
        with:
          path: .ci-clean-marker
          key: ${{ steps.day.outputs.key }}
          lookup-only: true
      - uses: ./.github/actions/swift-build
        with:
          clean: ${{ needs.plan.outputs.clean == 'true' || steps.marker.outputs.cache-hit != 'true' }}
          save: "true"
      - name: Remember it
        if: ${{ steps.marker.outputs.cache-hit != 'true' }}
        run: echo "$(date -u)" > .ci-clean-marker
      - name: Save the marker
        if: ${{ steps.marker.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .ci-clean-marker
          key: ${{ steps.day.outputs.key }}

  tests:
    name: tests ${{ matrix.shard.id }}
    needs: [plan, build]
    # `always()` so a skipped build (a pull request has none) does not skip the shards.
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.swift == 'true' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: macos-26
    # A build takes about 5 minutes (10 clean) and a shard's tests about 5; a flake-hunt shard runs them three times.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.checkout_ref }}

      # Restores the build the build job saved, or (pull requests, no build job) the base
      # branch's newest and compiles what this change touched. Pull requests save nothing, which
      # keeps the cache quota free and an upload off the critical path.
      - uses: ./.github/actions/swift-build
        with:
          clean: ${{ needs.plan.outputs.shared_build != 'true' && needs.plan.outputs.clean == 'true' }}

      # Serially within a shard: on the shared 3-core runner, tests run in parallel queued behind
      # one another's main-thread work until their waits ran out. The tests that block the main
      # queue or change process-wide state still run as exit tests in their own process. The
      # script lists the tests, cuts this shard's suites, runs them under a watchdog, retries
      # failed tests once, and writes the summary, annotations and results.
      - name: Run tests
        env:
          SELECTION: ${{ needs.plan.outputs.selection }}
        run: |
          python3 scripts/ci_run_tests.py swift --shard "${{ matrix.shard.id }}" --selection "$SELECTION" \
            --repeat "${{ needs.plan.outputs.repeat }}" --lane "${{ needs.plan.outputs.lane }}" --out ci-out

      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-results-swift-${{ matrix.shard.slug }}
          path: ci-out/*.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-swift-${{ matrix.shard.slug }}
          path: |
            ci-out/*.log
            ci-out/tests.txt
          retention-days: 7
          if-no-files-found: ignore

  # The one check to require: green only when every job the plan asked for passed. A job the
  # plan skipped (no Swift tests for an extensions-only change) counts as passing.
  ci:
    name: CI
    needs: [plan, release-rules, extensions, build, tests]
    if: ${{ always() && needs.plan.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) echo "::error::a job ended $result"; exit 1 ;; esac
          done

  # A full lane on nightly or master (and the daily and manual runs) files or updates the one
  # tracking issue: a comment per red run with its failing tests, a count of flaky tests in the
  # body. It is not part of CI: a failure here never turns a run red.
  report:
    name: report
    needs: [plan, release-rules, extensions, build, tests]
    if: ${{ always() && needs.plan.outputs.report == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.checkout_ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: ci-results-*
          path: results
      - name: Update the tracking issue
        env:
          JOB_RESULTS: ${{ join(needs.*.result, ' ') }}
          TESTED_REF: ${{ needs.plan.outputs.checkout_ref || github.ref_name }}
        run: |
          result=success
          case " $JOB_RESULTS " in *" cancelled "*) result=cancelled ;; *" failure "*) result=failure ;; esac
          python3 scripts/ci_report.py --results results --result "$result" --sha "$(git rev-parse HEAD)" --ref "$TESTED_REF"
