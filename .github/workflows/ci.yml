name: CI

# Tests gate master (the release branch) and PRs. Nightly pushes skip CI:
# the Release workflow already builds every nightly, and the timing-sensitive
# server tests flake on slow shared runners — run `swift test` locally.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push supersedes a queued/running build of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test
    runs-on: macos-26
    # The suite finishes in seconds; anything longer is a hang, not work.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # SPM build products (libghostty, SwiftTerm, all targets). Keyed on the
      # dependency pins + Swift version; a push that only changes sources
      # restores the previous cache and rebuilds incrementally.
      - name: Swift version
        id: swift
        run: echo "version=$(swift --version 2>/dev/null | head -1 | shasum -a 256 | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Cache SPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ steps.swift.outputs.version }}-

      - name: Run tests
        run: |
          # SwiftPM copies binary frameworks (Sparkle) to Products/<config>,
          # but test-bundle rpaths expect PackageFrameworks; bridge the two.
          swift build --build-tests
          for d in .build/*/debug .build/out/Products/Debug; do
            [ -d "$d" ] || continue
            mkdir -p "$d/PackageFrameworks"
            [ -d "$d/Sparkle.framework" ] && ln -sf "$PWD/$d/Sparkle.framework" "$d/PackageFrameworks/Sparkle.framework" || true
          done
          # --no-parallel: OutputCoalescingTests deliberately blocks the
          # main queue (backpressure test); concurrent suites on a slow
          # shared runner deadlock behind it. Serial is still fast.
          # Watchdog: the suite finishes in seconds; if it stalls for 5
          # minutes, dump thread stacks of the hung test host, then fail.
          swift test --no-parallel &
          TEST_PID=$!
          (
            sleep 300
            if kill -0 "$TEST_PID" 2>/dev/null; then
              echo '::group::watchdog: test run stalled, sampling processes'
              ps auxww | grep -iE 'swift|shepherd' | grep -v grep
              for pid in $(pgrep -f swiftpm-testing); do
                sample "$pid" 3 -file /tmp/sample-$pid.txt || true
                cat /tmp/sample-$pid.txt || true
              done
              echo '::endgroup::'
              kill -9 "$TEST_PID" 2>/dev/null || true
              pkill -9 -f swiftpm-testing 2>/dev/null || true
            fi
          ) &
          WATCHDOG_PID=$!
          wait "$TEST_PID"
          STATUS=$?
          kill "$WATCHDOG_PID" 2>/dev/null || true
          exit "$STATUS"
