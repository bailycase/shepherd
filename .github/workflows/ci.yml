name: CI

# One Swift job. A pull request from a maintainer runs on the self-hosted Mac, where the
# checkout, `.build` and the pi engine's downloads persist between jobs, so a run is an
# incremental build plus the tests. Everything else (a fork, the daily run, a manual run) builds
# on GitHub's macOS runner. The release rules and extension tests run on Ubuntu beside it.
#
# There are no path filters here: a filtered-out workflow never reports the `CI` check, so the
# plan step decides instead, and `CI` always reports. A change to docs alone runs no Swift.
# Tests whose verdict depends on the machine's speed skip here, where CI=true (`.timingSensitive`).
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Only the default branch's copy of this file is scheduled, so this starts once master has it.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      clean:
        description: Ignore the persistent build and build from scratch
        type: boolean
        default: false

permissions:
  contents: read

# A newer push supersedes a running build of the same branch or pull request.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'daily' || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Whether this change can affect Swift at all (docs and templates cannot).
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      swift: ${{ steps.plan.outputs.swift }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'schedule' && 'master' || '' }}
      - name: Plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          swift=true
          if [ "$EVENT" = pull_request ]; then
            # The checkout is the merge of the pull request into its base: the first parent is the base.
            git diff --name-only --no-renames HEAD^1 HEAD > changed.txt
            swift=$(python3 scripts/ci_plan.py changed.txt)
          fi
          echo "swift=$swift" >> "$GITHUB_OUTPUT"
          echo "swift=$swift"

  # The release workflow's rules (scripts/release.py), the CI helper's own tests, the embedded
  # extension copies and the docs' size and link guards. Stdlib only; it costs no macOS runner.
  release-rules:
    name: release rules
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'master' || '' }}
      - run: python3 -m unittest discover -s Tests/Release

  extensions:
    name: extension tests
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'master' || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cache the pinned pi package
        id: pi
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pi-tests
          key: pi-tests-${{ hashFiles('scripts/pi-engine-pin.json') }}
      - name: Install the pinned modular pi package
        if: steps.pi.outputs.cache-hit != 'true'
        run: |
          package=$(python3 -c 'import json; p=json.load(open("scripts/pi-engine-pin.json"))["pi"]; print(p["name"]+"@"+p["version"])')
          npm install --prefix "$RUNNER_TEMP/pi-tests" --ignore-scripts --no-audit --no-fund "$package"
      - name: Test extensions with isolated fake providers
        env:
          PI_PACKAGE_DIR: ${{ runner.temp }}/pi-tests/node_modules/@earendil-works/pi-coding-agent
        run: node --test --test-reporter=spec Tests/Extensions/*.test.mjs

  tests:
    name: swift tests
    needs: plan
    if: ${{ needs.plan.outputs.swift == 'true' }}
    # Native metadata fence, evaluated before checkout; plan outputs cannot grant local access.
    # Custom label only: the runner has no default self-hosted/OS labels.
    runs-on: >-
      ${{ github.triggering_actor == github.actor &&
          (github.actor_id == '19316389' || github.actor_id == '3370624') &&
          github.workflow_ref == format('{0}/.github/workflows/ci.yml@{1}', github.repository, github.ref) &&
          github.event_name == 'pull_request' &&
          github.ref == format('refs/pull/{0}/merge', github.event.pull_request.number) &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (github.event.pull_request.user.id == 19316389 || github.event.pull_request.user.id == 3370624) &&
          'shepherd-release' || 'macos-26' }}
    timeout-minutes: 60
    env:
      # Mask the built-in runner machine-name log, before any steps run.
      SELFHOSTED_LOG_MASK: ${{ secrets.SELFHOSTED_HOSTNAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'master' || '' }}
          clean: ${{ runner.environment != 'self-hosted' }}
          persist-credentials: false
      - uses: ./.github/actions/swift-build
        with:
          clean: ${{ inputs.clean == true }}
      - name: Stage bundled pi for subagent file checks
        run: python3 scripts/pi_engine.py stage
      # The app suites gate themselves onto one main-actor queue (`.mainActorExclusive`); the
      # server, unit and design-kit suites run beside that queue.
      - name: Run tests
        env:
          CI: "true"
        run: |
          if swift test --skip-build $SWIFTPM_FLAGS > "$RUNNER_TEMP/swift-test.log" 2>&1; then
            tail -20 "$RUNNER_TEMP/swift-test.log"
          else
            tail -120 "$RUNNER_TEMP/swift-test.log"
            exit 1
          fi
      - name: Upload the log
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-swift-test-log
          path: ${{ runner.temp }}/swift-test.log
          retention-days: 7

  # The one required check. It passes when every job passed or was skipped on purpose.
  ci:
    name: CI
    needs: [plan, release-rules, extensions, tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) echo "::error::a job ended $result"; exit 1 ;; esac
          done
