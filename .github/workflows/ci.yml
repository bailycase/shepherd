name: CI

# Tests gate master (the release branch) and PRs. Nightly pushes skip CI:
# the Release workflow already builds every nightly. Tests whose verdict
# depends on the machine's speed (frame sampling, wall-clock budgets) skip
# here, where GitHub sets CI=true; `swift test` runs them locally (AGENTS.md,
# Testing).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push supersedes a queued/running build of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test
    runs-on: macos-26
    # Building takes about 6 minutes, and a serial test run took 8 to 12 on
    # a Mac's efficiency cores; the watchdog below ends a stalled run at 30.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # SPM build products (libghostty, SwiftTerm, all targets). Keyed on the
      # dependency pins + Swift version; a push that only changes sources
      # restores the previous cache and rebuilds incrementally.
      - name: Swift version
        id: swift
        run: echo "version=$(swift --version 2>/dev/null | head -1 | shasum -a 256 | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - name: Cache SPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ steps.swift.outputs.version }}-

      # The release workflow's rules (scripts/release.py): feeds, bundle ids,
      # and their agreement with the Xcode project and the apps.
      - name: Release rules
        run: python3 -m unittest discover -s Tests/Release

      - name: Run tests
        run: |
          # SwiftPM copies binary frameworks (Sparkle) to Products/<config>,
          # but test-bundle rpaths expect PackageFrameworks; bridge the two.
          swift build --build-tests
          for d in .build/*/debug .build/out/Products/Debug; do
            [ -d "$d" ] || continue
            mkdir -p "$d/PackageFrameworks"
            [ -d "$d/Sparkle.framework" ] && ln -sf "$PWD/$d/Sparkle.framework" "$d/PackageFrameworks/Sparkle.framework" || true
          done
          # Serially: on this shared 3-core runner, tests run in parallel
          # queued behind one another's main-thread work until their waits
          # ran out. The tests that block the main queue or change
          # process-wide state still run as exit tests in their own process.
          # Every integration suite has a per-test time limit, so a hang
          # that honors cancellation fails by name. The watchdog is for one
          # that does not (a blocked thread): a serial run took 8 to 12
          # minutes on a Mac's efficiency cores, so if it is still going
          # after 30, dump thread stacks of the hung test host, then fail.
          swift test --no-parallel &
          TEST_PID=$!
          (
            sleep 1800
            if kill -0 "$TEST_PID" 2>/dev/null; then
              echo '::group::watchdog: test run stalled, sampling processes'
              ps auxww | grep -iE 'swift|shepherd' | grep -v grep
              for pid in $(pgrep -f swiftpm-testing); do
                sample "$pid" 3 -file /tmp/sample-$pid.txt || true
                cat /tmp/sample-$pid.txt || true
              done
              echo '::endgroup::'
              kill -9 "$TEST_PID" 2>/dev/null || true
              pkill -9 -f swiftpm-testing 2>/dev/null || true
            fi
          ) &
          WATCHDOG_PID=$!
          wait "$TEST_PID"
          STATUS=$?
          kill "$WATCHDOG_PID" 2>/dev/null || true
          exit "$STATUS"
