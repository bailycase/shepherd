name: Release build
run-name: Self-hosted release ${{ inputs.parent_run }}-${{ inputs.parent_attempt }}

# Dispatch is local-only, build-only, and fenced on an active Nightly Release parent.
# This workflow must also exist on the default branch before dispatch is available.
on:
  workflow_dispatch:
    inputs:
      parent_run:
        type: string
        required: true
      parent_attempt:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      build_number:
        type: string
        required: true
      plan:
        type: string
        required: true
  workflow_call:
    inputs:
      parent_run:
        type: string
        required: true
      parent_attempt:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      build_number:
        type: string
        required: true
      plan:
        type: string
        required: true
      hosted:
        type: boolean
        default: true
    secrets:
      SELFHOSTED_HOSTNAME:
        required: false
      DEVELOPER_ID_P12:
        required: false
      DEVELOPER_ID_P12_PASSWORD:
        required: false
      NOTARY_KEY_ID:
        required: false
      NOTARY_ISSUER_ID:
        required: false
      NOTARY_KEY:
        required: false

permissions:
  contents: read
  actions: read

jobs:
  guard:
    name: Validate the Release parent
    if: github.event_name != 'pull_request' && (inputs.hosted || github.ref == 'refs/heads/nightly')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
      PARENT_RUN: ${{ inputs.parent_run }}
      PARENT_ATTEMPT: ${{ inputs.parent_attempt }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      RELEASE_PLAN: ${{ inputs.plan }}
    steps:
      # Validate from the trusted workflow ref before checking out the supplied SHA on Self-hosted.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/release_runner.py validate ${{ !inputs.hosted && '--local' || '' }}

  build:
    name: build package
    needs: guard
    if: github.event_name != 'pull_request' && (inputs.hosted || github.ref == 'refs/heads/nightly')
    # Custom label only: Self-hosted was registered without default self-hosted/OS labels.
    runs-on: ${{ !inputs.hosted && 'shepherd-release' || 'macos-26' }}
    timeout-minutes: 60
    env:
      # Referencing the hostname as a secret masks the runner's built-in machine-name log.
      SELFHOSTED_LOG_MASK: ${{ secrets.SELFHOSTED_HOSTNAME }}
      APP_KEY: ${{ fromJSON(inputs.plan).app }}
      APP_NAME: ${{ fromJSON(inputs.plan).name }}
      VERSION: ${{ fromJSON(inputs.plan).version }}
      TAG: ${{ fromJSON(inputs.plan).tag }}
      SCHEME: ${{ fromJSON(inputs.plan).scheme }}
      CONFIGURATION: ${{ fromJSON(inputs.plan).configuration }}
      PRODUCTS: build/Build/Products/${{ fromJSON(inputs.plan).configuration }}
      PRODUCT: ${{ fromJSON(inputs.plan).product }}
      DMG: ${{ fromJSON(inputs.plan).dmg }}
      DSYMS: ${{ fromJSON(inputs.plan).dsyms }}
      VOLUME: ${{ fromJSON(inputs.plan).volume }}
      PARENT_RUN: ${{ inputs.parent_run }}
      PARENT_ATTEMPT: ${{ inputs.parent_attempt }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      RELEASE_PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          clean: ${{ runner.environment != 'self-hosted' }}
          persist-credentials: false
      - name: Fence the build on its active parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_runner.py validate ${{ !inputs.hosted && '--local' || '' }}

      - name: Xcode version
        id: xcode
        run: |
          toolchain=$({ xcodebuild -version; xcrun --show-sdk-version; swift --version; } 2>/dev/null)
          echo "version=$(shasum -a 256 <<<"$toolchain" | cut -c1-12)" >> "$GITHUB_OUTPUT"
          # A previous cross-commit release cache left transitive ShepherdCore objects stale.
          # Reuse products only while shared library inputs match, not across model/ABI changes.
          shared=$(git ls-files -s Sources Packages Package.swift Package.resolved Shepherd.xcodeproj scripts/pi-engine-pin.json scripts/pi_engine.py ':(exclude)Sources/ShepherdApp/**' | shasum -a 256 | cut -c1-12)
          echo "shared=$shared" >> "$GITHUB_OUTPUT"
      # Hosted caches and persistent local products share the same invalidation rule.
      - name: Cache DerivedData
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: build
          key: xcode-${{ runner.os }}-${{ env.CONFIGURATION }}-${{ steps.xcode.outputs.version }}-${{ steps.xcode.outputs.shared }}-${{ inputs.source_sha }}
          restore-keys: |
            xcode-${{ runner.os }}-${{ env.CONFIGURATION }}-${{ steps.xcode.outputs.version }}-${{ steps.xcode.outputs.shared }}-
      - name: Start over when shared build inputs changed
        env:
          VERSION: ${{ steps.xcode.outputs.version }}-${{ steps.xcode.outputs.shared }}
        run: |
          marker=build/ci-toolchain
          if [ -d build ] && [ "$(cat "$marker" 2>/dev/null)" != "$VERSION" ]; then
            echo "Shared build inputs changed: discarding DerivedData products"
            find build -mindepth 1 -maxdepth 1 ! -name SourcePackages -exec rm -rf {} +
          fi
          mkdir -p build && echo "$VERSION" > "$marker"

      # The pi engine (Node and pi's bundle) the Mac target's "Embed pi engine" phase copies
      # into Contents/Helpers and Contents/Resources/pi-engine. Staging downloads Node from
      # nodejs.org and pi from the npm registry, checked against scripts/pi-engine-pin.json;
      # the cache keeps those downloads, and staging reuses one only while it matches the pin.
      - name: Cache the pi engine's downloads
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: .build/pi-engine-cache
          key: pi-engine-${{ hashFiles('scripts/pi-engine-pin.json') }}
      - name: Stage the pi engine
        run: python3 scripts/pi_engine.py stage

      - name: Fence signing on the active parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_runner.py validate ${{ !inputs.hosted && '--local' || '' }}
      - name: Import Developer ID certificate
        id: cert
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [[ -z "$P12" ]]; then
            echo "identity=-" >> "$GITHUB_OUTPUT"
            echo "No Developer ID cert; ad-hoc signing."
            exit 0
          fi
          umask 077
          security list-keychains -d user > "$RUNNER_TEMP/release-keychains.txt"
          KEYCHAIN="$RUNNER_TEMP/release-build.keychain-db"
          KEYCHAIN_PASSWORD=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          python3 -c 'import os,shlex,subprocess; old=shlex.split(open(os.environ["RUNNER_TEMP"]+"/release-keychains.txt").read()); subprocess.run(["security","list-keychains","-d","user","-s",os.environ["RUNNER_TEMP"]+"/release-build.keychain-db",*old],check=True)'
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          test -n "$IDENTITY" || { echo "::error::Imported certificate has no Developer ID identity."; exit 1; }
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      # Apple silicon only. The Mac target sets ARCHS = arm64, but SwiftPM package
      # targets take no target settings, so the command line sets it for them too.
      - name: Build ${{ env.APP_NAME }}
        run: |
          xcodebuild \
            -project Shepherd.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            -onlyUsePackageVersionsFromResolvedFile \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

      # Prebuilt binaries (Sparkle's framework and its helpers) come universal.
      - name: Thin to arm64
        run: python3 scripts/release.py thin-app "$PRODUCTS/$PRODUCT"

      # The one guard against shipping one app under the other's identity:
      # bundle id, name, executable and feed must be this app's. It also checks
      # every binary is arm64 only, and the pi engine is the pinned one, with
      # nothing but what pi's bundle loads.
      - name: Verify the app's identity
        run: python3 scripts/release.py verify-app "$PRODUCTS/$PRODUCT" "$APP_KEY" "$VERSION"

      # The dSYMs ship zipped on the GitHub release (the only copy; the workflow artifact they
      # also went to expired first anyway). Never fails a release.
      - name: Zip dSYMs
        continue-on-error: true
        working-directory: ${{ env.PRODUCTS }}
        run: zip -qr "$GITHUB_WORKSPACE/$DSYMS" ./*.dSYM

      # `xcodebuild build` never strips, so the app binary would ship a debug
      # map of runner object-file paths. -S -x drops debug and local symbols
      # and keeps global ones, so crash logs stay partly readable; the dSYMs
      # above predate the strip and share its UUIDs, so they still symbolicate.
      # The engine's node (Contents/Helpers) is Node's release binary and stays
      # as Node ships it.
      - name: Strip debug symbols
        run: xcrun strip -S -x "$PRODUCTS/$PRODUCT/Contents/MacOS/"*

      # node is signed with the engine's entitlements (V8 needs allow-jit under
      # the hardened runtime); scripts/sign-engine.sh says why.
      - name: Sign
        run: |
          scripts/sign-app.sh "$PRODUCTS/$PRODUCT" \
            '${{ steps.cert.outputs.identity }}' App/Shepherd.entitlements \
            App/Engine.entitlements

      - name: Smoke test the shipped SDK
        run: |
          SHEPHERD_ENGINE_SMOKE="$PRODUCTS/$PRODUCT" \
            python3 -m unittest discover -s Tests/Release -p test_pi_engine_sdk.py

      - name: Notarize
        if: steps.cert.outputs.identity != '-'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          APP="$PRODUCTS/$PRODUCT"
          umask 077
          printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --sequesterRsrc --keepParent "$APP" notarize.zip
          xcrun notarytool submit notarize.zip \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP"

      - name: Package DMG
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          STAGE=$(mktemp -d "$RUNNER_TEMP/release-dmg.XXXXXX")
          cp -R "$PRODUCTS/$PRODUCT" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "$VOLUME" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          # Both app and DMG carry accepted tickets, including offline at mount time.
          if [[ '${{ steps.cert.outputs.identity }}' != '-' ]]; then
            codesign --force --timestamp --sign '${{ steps.cert.outputs.identity }}' "$DMG"
            # notary.p8 was written by the Notarize step.
            xcrun notarytool submit "$DMG" \
              --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" \
              --wait
            xcrun stapler staple "$DMG"
          fi
          shasum -a 256 "$DMG"

      - name: Record package provenance
        env:
          SIGNING_IDENTITY: ${{ steps.cert.outputs.identity }}
        run: |
          python3 -c 'import json,os; print(json.dumps({"version":1,"tag":os.environ["TAG"],"eligible":bool(os.environ["SIGNING_IDENTITY"] and os.environ["SIGNING_IDENTITY"] != "-")}))' > shepherd-appcast.json
          python3 scripts/release_runner.py manifest
      - name: Keep the complete release package
        uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ inputs.parent_run }}-${{ inputs.parent_attempt }}
          path: |
            ${{ env.DMG }}
            shepherd-appcast.json
            release-package.json
            ${{ env.DSYMS }}
          if-no-files-found: error
          retention-days: 7
      - name: Restore keychains and remove signing credentials
        if: always()
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, shlex, subprocess
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          old = temp / "release-keychains.txt"
          try:
              if old.exists():
                  subprocess.run(["security", "list-keychains", "-d", "user", "-s", *shlex.split(old.read_text())], check=True)
          finally:
              keychain = temp / "release-build.keychain-db"
              try:
                  if keychain.exists():
                      subprocess.run(["security", "delete-keychain", str(keychain)], check=True)
              finally:
                  for name in ("cert.p12", "notary.p8", "release-keychains.txt"):
                      (temp / name).unlink(missing_ok=True)
          PYTHON
