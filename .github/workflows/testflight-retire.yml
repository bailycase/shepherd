name: Retire TestFlight builds

# Keeps only the newest Shepherd iOS build installable in TestFlight. After a
# Release run on nightly uploads a build, this waits for Apple to process it
# (up to 45 minutes; then it gives up and expires nothing) and expires every
# older build. scripts/release.py retire-testflight holds the rules (tested in
# Tests/Release); this file only runs them.
#
# workflow_run and workflow_dispatch fire only for a workflow file on the
# default branch, so this runs from there, with that branch's release.py.
#
# By hand: Actions > Retire TestFlight builds > Run workflow. It is a dry run
# unless dry_run is unchecked, and with no build number it keeps the newest
# processed build without waiting for one.
#
# Secrets: APP_STORE_CONNECT_KEY_ID / APP_STORE_CONNECT_ISSUER_ID /
# APP_STORE_CONNECT_KEY_P8, the key release.yml uploads with. Without them it
# does nothing.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [nightly]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Say what would expire, and expire nothing
        type: boolean
        default: true
      build:
        description: Build number to wait for (empty keeps the newest processed build)
        type: string
        required: false

permissions:
  contents: read
  # Reads the triggering Release run's jobs, to see whether it uploaded.
  actions: read

# Two runs never race over the same builds: a later one waits its turn.
concurrency:
  group: testflight-retire
  cancel-in-progress: false

jobs:
  retire:
    name: expire older TestFlight builds
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'nightly' &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Did the Release run upload to TestFlight?
        id: upload
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          uploaded=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" \
            | python3 scripts/release.py testflight-job)
          echo "$uploaded" >> "$GITHUB_OUTPUT"
          if [[ "$uploaded" == "uploaded=false" ]]; then
            echo "::notice title=TestFlight::That Release run uploaded no iOS build; nothing to retire."
          fi

      # Secrets cannot appear in `if:`, so only whether all three are set
      # leaves this step.
      - name: Write the App Store Connect key
        id: key
        if: steps.upload.outputs.uploaded != 'false'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          if [[ -z "$KEY_ID" || -z "$ISSUER_ID" || -z "$KEY_P8" ]]; then
            echo "::notice title=TestFlight::The APP_STORE_CONNECT_* secrets are not all set; nothing to retire."
            exit 0
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          if ! grep -q 'BEGIN PRIVATE KEY' "$RUNNER_TEMP/asc/AuthKey.p8"; then
            echo "::error::APP_STORE_CONNECT_KEY_P8 must be the .p8 file's text as-is, not base64." && exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # The Release run's number is the build number it uploaded (release.yml's
      # BUILD), so this waits for that build, not merely the newest one.
      - name: Expire older builds
        if: steps.key.outputs.ready == 'true'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          BUILD: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.run_number || inputs.build }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          args=(--key-file "$RUNNER_TEMP/asc/AuthKey.p8" --timeout 2700 --interval 45)
          if [[ -n "$BUILD" ]]; then
            args+=(--wait-for-build "$BUILD")
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python3 scripts/release.py retire-testflight "${args[@]}"

      - name: Remove the App Store Connect key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
