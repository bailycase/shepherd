name: Swift build
description: >
  `swift build --build-tests`, incrementally on top of the last build. On the self-hosted
  runner the checkout and `.build` persist between jobs, so nothing is restored or saved. On a
  hosted runner the dependency checkouts and the branch's newest build come from the cache.
  Exports SWIFTPM_FLAGS so later steps call SwiftPM (`swift test --skip-build
  $SWIFTPM_FLAGS`) exactly as it built.

inputs:
  clean:
    description: "'true' builds from scratch."
    default: "false"

runs:
  using: composite
  steps:
    # Every SwiftPM call must use the same flags, or it replans the build.
    # --force-resolved-versions skips the network "Updating" pass,
    # --manifest-cache local keeps evaluated manifests inside .build.
    - name: Swift version and flags
      id: swift
      shell: bash
      run: |
        flags="--force-resolved-versions --disable-index-store --manifest-cache local"
        echo "SWIFTPM_FLAGS=$flags" >> "$GITHUB_ENV"
        toolchain=$({ swift --version; xcrun --show-sdk-version; xcodebuild -version; } 2>/dev/null)
        echo "$toolchain"
        echo "version=$(shasum -a 256 <<<"$toolchain" | cut -c1-12)" >> "$GITHUB_OUTPUT"

    # Hosted runners start empty. A pull request may restore its base branch's cache, but
    # never saves one. The self-hosted checkout uses its existing .build instead.
    - name: Restore dependency and build caches
      id: cache
      if: runner.environment == 'github-hosted'
      uses: actions/cache/restore@v4
      with:
        path: .build
        key: spm-${{ runner.os }}-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
        restore-keys: |
          spm-${{ runner.os }}-${{ steps.swift.outputs.version }}-${{ hashFiles('Package.resolved') }}-
          spm-${{ runner.os }}-${{ steps.swift.outputs.version }}-

    # Validate after restoring too. Keep dependency checkouts and verified pi downloads when
    # the toolchain changes or clean=true, but never keep products from the old build.
    - name: Start over when the toolchain changed or a clean build was asked for
      shell: bash
      env:
        VERSION: ${{ steps.swift.outputs.version }}
        CLEAN: ${{ inputs.clean }}
      run: |
        marker=.build/ci-toolchain
        if [ -d .build ] && { [ "$CLEAN" = true ] || [ "$(cat "$marker" 2>/dev/null)" != "$VERSION" ]; }; then
          echo "building from scratch (clean=$CLEAN, built by $(cat "$marker" 2>/dev/null || echo nothing), toolchain $VERSION)"
          find .build -mindepth 1 -maxdepth 1 ! -name repositories ! -name checkouts \
            ! -name artifacts ! -name workspace-state.json ! -name pi-engine-cache -exec rm -rf {} +
        fi
        mkdir -p .build
        echo "$VERSION" > "$marker"

    # SwiftPM's native build system gives each Swift target's compile command only its direct
    # dependencies' modules as inputs, so a target using a transitive module can be left stale
    # when only that module changed. Removing the swift-version file makes every target run its
    # swift-driver, which knows every module its files loaded and recompiles exactly what changed
    # (a few seconds when nothing did).
    - name: Build
      shell: bash
      run: |
        rm -f .build/*/debug/swift-version-*.txt
        swift build --build-tests $SWIFTPM_FLAGS
        # SwiftPM copies binary frameworks (Sparkle) to Products/<config>, but test-bundle rpaths
        # expect PackageFrameworks; bridge the two.
        for d in .build/*/debug; do
          [ -d "$d/Sparkle.framework" ] || continue
          mkdir -p "$d/PackageFrameworks"
          ln -sfn "$PWD/$d/Sparkle.framework" "$d/PackageFrameworks/Sparkle.framework"
        done

    - name: Save the hosted branch build
      if: runner.environment == 'github-hosted' && github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: .build
        key: ${{ steps.cache.outputs.cache-primary-key }}
